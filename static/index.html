<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DROP Assistant</title>
<style>
:root{--bg:#f4f6f9;--ink:#14263d;--muted:#64748b;--line:#e1e7ef;--blue:#2559df;--green:#147d63}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}header{background:#12253e;color:#fff;padding:25px 4%;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:25px;letter-spacing:-1px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#a9c0e2}header p{margin:4px 0 0;color:#b7c5d9}main{max-width:1350px;margin:0 auto;padding:28px 32px}.mode{display:flex;gap:6px;background:#263b57;padding:5px;border-radius:10px}button,select,input,textarea{font:inherit}button,.link{border:1px solid var(--line);border-radius:7px;padding:9px 14px;background:white;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}button:hover,.link:hover{border-color:var(--blue)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--blue);color:white;border-color:var(--blue)}.mode button{background:transparent;color:white;border:0}.mode .on{background:white;color:var(--ink)}.banner{background:#e9f0ff;border:1px solid #cddcfd;border-radius:9px;padding:12px 16px;margin-bottom:22px;color:#234276}.banner.sandbox{background:#fff5e4;border-color:#eed8aa;color:#79531b}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.metric,.card{background:white;border:1px solid var(--line);border-radius:11px}.metric{padding:19px 22px}.metric span{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:32px;line-height:1.3}.metric small{color:var(--muted)}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:24px 0 20px}.tabs{display:flex;gap:25px;border-bottom:1px solid var(--line);margin:18px 0}.tabs button{border:0;border-radius:0;background:none;padding:12px 0;color:var(--muted)}.tabs .on{color:var(--blue);box-shadow:0 2px var(--blue);font-weight:650}.card{padding:20px;margin-bottom:16px}.card h2{font-size:17px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 17px}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:12px 10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #eef1f5;vertical-align:top}tr:last-child td{border-bottom:0}.tablewrap{overflow:auto}.tag{display:inline-block;border-radius:20px;background:#eef2f6;padding:3px 9px;font-size:11px;font-weight:650;white-space:nowrap}.tag.ready,.tag.complete{background:#e4f4ed;color:var(--green)}.tag.review{background:#fff2d7;color:#946014}.tag.new{background:#e9f0ff;color:var(--blue)}code{font:12px ui-monospace,monospace}.empty{text-align:center;padding:52px 18px;color:var(--muted)}.empty b{display:block;font-size:20px;color:var(--ink);margin-bottom:8px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}.hidden{display:none!important}#notice{padding:12px 16px;background:#e4f4ed;color:#145e48;border-radius:8px;margin-bottom:14px;white-space:pre-wrap;overflow-wrap:anywhere}.review-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px}.case-list button{width:100%;text-align:left;margin-bottom:8px}.case-list .selected{border:2px solid var(--blue);background:#edf3ff}.case-list small{display:block;color:var(--muted)}.case-detail{min-width:0}.evidence-box{background:#f7f9fc;border:1px solid var(--line);padding:14px;border-radius:8px;margin:14px 0}.warning-box{background:#fff5e4;border:1px solid #edd49e;padding:13px;border-radius:8px;margin:12px 0}.danger{color:#9b342a;border-color:#dba49d}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field-grid label{display:flex;flex-direction:column;font-weight:600;font-size:12px;gap:4px}.wide{grid-column:1 / -1}.review-actions{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.checkline{display:block;margin:10px 0}.diff{background:#fff7e8}.agree{background:#f0f9f4}.case-detail h3{font-size:15px;margin:23px 0 8px}.tag.deferred,.tag.disputed{background:#fce8e6;color:#9b342a}dialog{max-width:650px;width:92%;border:1px solid var(--line);border-radius:12px;padding:24px;color:var(--ink)}dialog::backdrop{background:#14263d88}.case-detail td{max-width:340px;overflow-wrap:anywhere}.case-detail input:not([type=checkbox]),.case-detail select{width:100%}@media(max-width:900px){.review-layout{grid-template-columns:1fr}.case-list{display:flex;gap:8px;overflow:auto}.case-list button{min-width:180px}.field-grid{grid-template-columns:1fr}}#notice.error{background:#ffe9e7;color:#8d3028}.reviewgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.person{border:1px solid var(--line);padding:14px;border-radius:8px}.person p{margin:5px 0}.person small{color:var(--muted)}textarea{width:100%;min-height:68px;border:1px solid var(--line);border-radius:6px;padding:10px;margin:12px 0}select,input{border:1px solid var(--line);border-radius:6px;padding:8px}footer{color:var(--muted);font-size:12px;margin:25px 0}.note{font-size:12px;color:var(--muted)}details{margin-top:12px}pre{white-space:pre-wrap;word-break:break-word;font-size:11px}.workflow{display:flex;gap:10px;margin-top:15px}.workflow div{flex:1;border-top:3px solid #dce6f8;padding:10px 0;color:var(--muted);font-size:12px}@media(max-width:700px){main{padding:20px 14px}header{align-items:flex-start;gap:10px}.metrics{grid-template-columns:1fr 1fr}.tabs{gap:16px}.metric{padding:14px}.workflow{flex-wrap:wrap}}
</style></head><body>
<header><div><div class="eyebrow">Privacy operations · implementation lab</div><h1>DROP Assistant</h1><p>From deletion request to documented outcome.</p></div><div class="mode"><button id="demoMode" class="on" onclick="setMode('demo')">Demo</button><button id="sandboxMode" onclick="setMode('sandbox')">DROP sandbox</button></div></header>
<main><div id="banner" class="banner"></div><div id="notice" role="status" class="hidden"></div><div class="metrics" id="metrics"></div>
<div class="toolbar"><button id="importDemo" class="primary" onclick="run('demo_import')">1 · Load sample requests</button><button id="download" class="primary hidden" onclick="run('download')">1 · Download from DROP</button><button onclick="document.getElementById('zipfile').click()">Import ZIP</button><input id="zipfile" type="file" accept=".zip" class="hidden" onchange="importZip(this)"><button id="match" onclick="run('match')">2 · Match records</button><button id="execute" onclick="run('execute')">3 · Execute ready queue</button><span class="right note" id="connection"></span></div>
<div class="tabs"><button class="on" data-tab="requests" onclick="tab('requests')">Requests</button><button data-tab="review" onclick="tab('review')">Human review</button><button data-tab="database" onclick="tab('database')">Sample database</button><button data-tab="reporting" onclick="tab('reporting')">Reporting & API</button><button data-tab="audit" onclick="tab('audit')">Audit trail</button></div>
<section id="content"></section><footer>Prototype • Synthetic data only • Experimental ML assists review; exact hashes establish DROP matches. No production API writes.</footer></main>
<script src="/review.js"></script>
<script>
const TOKEN='__TOKEN__';let mode='demo',currentTab='requests',data={},busy=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statuses={2:'Exempted',3:'Deleted',4:'Opted out',5:'Not found'};
function notice(message,error=false){let n=document.getElementById('notice');n.textContent=message;n.className=error?'error':'';}
async function refresh(){const r=await fetch('/api/state?mode='+mode);data=await r.json();if(!r.ok)throw Error(data.error);render()}
async function run(action,p={}){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);notice('Processing…');let succeeded=false;try{const r=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':TOKEN},body:JSON.stringify({mode,...p})});const x=await r.json();if(!r.ok)throw Error(x.error);succeeded=true;notice(x.message || (action==='download'&&x.state==='preparing'?'DROP is preparing the archive. Try downloading again shortly.':action==='download'&&x.state==='no_data'?'DROP returned no new data.':action==='upload'?JSON.stringify(x,null,2):'Done. '+(x.processed!==undefined?x.processed+' requests matched.':x.count!==undefined?x.count+' records imported.':x.completed?x.completed.length+' synthetic deletions completed.':'')));}catch(e){notice(e.message,true)}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);await refresh()}return succeeded}
function setMode(m){if(busy)return;mode=m;document.getElementById('notice').className='hidden';refresh()}
function tab(t){if(busy)return;currentTab=t;render()}
function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function render(){
 const req=data.requests||[],active=req.filter(r=>r.active),review=active.filter(r=>['review','deferred','disputed'].includes(r.state)),ready=active.filter(r=>r.state==='ready'),done=active.filter(r=>r.state==='complete');
 document.getElementById('demoMode').className=mode==='demo'?'on':'';document.getElementById('sandboxMode').className=mode==='sandbox'?'on':'';
 document.getElementById('banner').className='banner '+(mode==='sandbox'?'sandbox':'');document.getElementById('banner').textContent=mode==='demo'?'DEMO ENVIRONMENT · 1,000 fictional broker records. All actions stay in this local demo database.':'OFFICIAL DROP SANDBOX · Real API traffic; a separate synthetic database. Unrelated sandbox identifiers will normally produce “Not found.”';
 document.getElementById('importDemo').classList.toggle('hidden',mode!=='demo');document.getElementById('download').classList.toggle('hidden',mode!=='sandbox');document.getElementById('connection').textContent=mode==='demo'?'No credentials required':data.api_configured?'Sandbox key configured':'Sandbox key not configured';
 document.getElementById('match').disabled=!active.some(r=>r.state==='new');document.getElementById('execute').disabled=!ready.length;
 document.getElementById('metrics').innerHTML=[[active.length,'Imported work items','Across '+data.batches.length+' batches'],[ready.length,'Ready for execution','Exact matches · synthetic records'],[review.length,'Need human review','Identity or policy decision'],[done.length,'Outcomes recorded',data.total_customers+' broker records remaining']].map(([n,l,s])=>'<div class="metric"><span>'+l+'</span><strong>'+n+'</strong><small>'+s+'</small></div>').join('');
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===currentTab));let html='';
 if(currentTab==='requests')html='<div class="card"><div class="row"><div><h2>Request workspace</h2><p class="sub">Every work item keeps its original DROP ID and a traceable outcome.</p></div></div>'+(req.length?table(['Work item','List','Decision','Outcome','Evidence'],req.map(r=>['<code>'+esc(r.id)+'</code>',esc(r.kind),'<span class="tag '+esc(r.state)+'">'+(r.active?esc(r.state):'removed')+'</span>',esc(statuses[r.status]||'Pending'),esc(r.explanation||'Awaiting matching')])):'<div class="empty"><b>Your workflow starts here</b>Load the sample requests to explore exact matches, exceptions, and human review.<div class="workflow"><div>01 · Import</div><div>02 · Match</div><div>03 · Review & act</div><div>04 · Report</div></div></div>')+'</div>';
 if(currentTab==='review')html=renderReviewQueue(review);
 if(currentTab==='database')html='<div class="card"><h2>Synthetic broker database</h2><p class="sub">Showing up to 100 of '+data.total_customers+' remaining records. Full CSV and SQLite database are included in the project.</p>'+table(['ID','Name','Email','DOB','ZIP','Policy'],data.customers.map(r=>[r.id,esc(r.FirstName+' '+r.LastName),esc(r.Email),esc(r.DOB),esc(r.ZIP),r.exempt?'Synthetic exemption':r.opted_out?'Opted out':'Active']))+'</div>';
 if(currentTab==='reporting'){
 html='<div class="card"><h2>Outcome reporting</h2><p class="sub">Resolve every active work item before exporting. API uploads are available only in sandbox mode.</p><p><code>'+esc(data.api_base)+'</code></p>'+data.batches.map(b=>'<div class="row" style="margin:14px 0"><b>Batch '+b.id+'</b><span class="tag">'+esc(b.source)+'</span><span class="note">'+esc(b.received)+'</span><a class="link" href="/api/export?mode='+mode+'&batch_id='+b.id+'">Download status CSVs</a>'+(mode==='sandbox'?'<button onclick="submitBatch('+b.id+',false)">Upload to sandbox</button><button onclick="submitBatch('+b.id+',true)">Submit amendment</button>':'')+'</div>').join('')+'<p class="note">HTTP 202 means queued for validation. Check the official portal and email before marking a submission validated. An uncertain delivery is never automatically resubmitted.</p></div><div class="card"><h2>API submission history</h2>'+(data.submissions.length?data.submissions.map(s=>'<div style="border-bottom:1px solid #eee;padding:12px 0"><b>#'+s.id+' · Batch '+s.batch_id+'</b> <span class="tag">'+esc(s.state)+'</span><details><summary>Response detail</summary><pre>'+esc(s.detail)+'</pre></details><button onclick="reconcile('+s.id+',\'validated\')">Record portal validation</button> <button onclick="reconcile('+s.id+',\'retry_allowed\')">Record safe-to-retry confirmation</button></div>').join(''):'<p class="sub">No API submissions yet.</p>')+'</div><div class="card"><h2>Connect your sandbox</h2><p>Sign in to the data broker portal and issue a sandbox API key. Set <code>DROP_API_KEY</code> in your local terminal, restart this app, then click Download from DROP.</p><p class="note">The app never displays or stores your key in SQLite. Production API access is intentionally unavailable with this synthetic database.</p></div>';
 }
 if(currentTab==='audit')html='<div class="card"><div class="row"><div><h2>Audit trail</h2><p class="sub">Latest 100 events · '+data.suppression_count+' active suppression entries.</p></div><a class="link right" href="/api/audit?mode='+mode+'">Export full audit JSON</a></div>'+table(['Time','Event','Request','Details'],data.audit.map(r=>[esc(r.time),esc(r.event),'<code>'+esc(r.request_id||'—')+'</code>','<code>'+esc(r.detail)+'</code>']))+'</div>';
 document.getElementById('content').innerHTML=html;
}

function submitBatch(id,amend){if(confirm('Send these synthetic-database outcomes to the actual DROP SANDBOX '+(amend?'amendment':'upload')+' endpoint?'))run('upload',{batch_id:id,amend,confirm:'SANDBOX'})}
function reconcile(id,result){const note=prompt('Record the portal/email evidence. For retry: confirm no rows were accepted, or resolve partial acceptance manually first.');if(note)run('reconcile',{id,result,note})}
async function importZip(input){const f=input.files[0];if(!f)return;if(f.size>20*1024*1024){notice('ZIP exceeds 20 MB limit',true);return}const bytes=new Uint8Array(await f.arrayBuffer());let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.subarray(i,i+8192));await run('import',{data:btoa(s)});input.value=''}
refresh().catch(e=>notice(e.message,true));
</script></body></html>
